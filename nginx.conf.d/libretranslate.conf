# Additive nginx config, included by Dokku's generated vhost (files under
# nginx.conf.d/*.conf at the app repo root get pulled into the server block on
# deploy). This is NOT a full vhost -- Dokku still owns TLS/proxy_pass/upstream.
#
# The pre-Dokku deployment used a hand-written full server block in
# /etc/nginx/conf.d/libretranslate.conf. Only the tuning below carried over;
# Dokku generates the rest.

# Translation of a large payload can take minutes. The old vhost used 300s and
# that value is load-bearing -- the default 60s truncates bulk jobs from lingua.
proxy_connect_timeout    60s;
proxy_send_timeout       300s;
proxy_read_timeout       300s;

# Bulk translation POSTs can be large; don't let nginx reject them.
client_max_body_size     25m;

# Deliberately NOT present: any proxy_cache* directive.
#
# Caching POST responses here would require `proxy_cache_methods POST` plus
# `$request_body` in the cache key -- and when a body exceeds
# client_body_buffer_size, nginx buffers it to disk and `$request_body`
# evaluates EMPTY. Every oversized request would then share one cache key and
# be served another request's translation. Silent, wrong, and hard to spot.
#
# See also the 2026-07-09 imgproxy outage, where an nginx proxy_cache
# misconfiguration served a single cached 502 to every client indefinitely
# (showcase memory: imgproxy-502-nginx-cache-incident).
#
# Translation caching belongs in `lingua`, which is the translation memory and
# can normalize on (source, target, text) instead of raw request bytes.
